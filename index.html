function day(){let p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bangkok",year:"numeric",month:"2-digit",day:"2-digit",weekday:"long"}).formatToParts(new Date());let g=t=>p.find(x=>x.type===t).value;return{y:g("year"),m:g("month"),d:g("day"),w:g("weekday")}}
function pick(x){let s=x.y+"-"+x.m+"-"+x.d,h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return Math.abs(h)%images.length}
let d=day();document.getElementById("cat").src=images[pick(d)];document.getElementById("date").textContent=d.w+", "+d.d+"/"+d.m+"/"+d.y;
</script></body></html>
